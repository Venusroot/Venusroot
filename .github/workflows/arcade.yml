name: Generate arcade animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pacman Contribution Graph
        run: npm install -g pacman-contribution-graph

      - name: Generate light theme
        run: |
          pacman-contribution-graph \
            --game breakout \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --gameTheme github \
            --output dist/breakout-contribution-graph.svg

      - name: Generate dark theme
        run: |
          pacman-contribution-graph \
            --game breakout \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --gameTheme github-dark \
            --output dist/breakout-contribution-graph-dark.svg

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
